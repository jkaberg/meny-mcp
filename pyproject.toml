[project]
name = "meny-mcp"
version = "0.1.0"
description = "MCP server for meny.no (NorgesGruppen FWC platform): search groceries, optimise price-per-unit, build week menus and populate the basket."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
meny-mcp = "meny_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meny_mcp"]
